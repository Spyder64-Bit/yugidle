name: Refresh card data
on:
  schedule:
    - cron: '17 3 * * 1' # every Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build data + extend schedule
        run: npm run data
      - name: Mirror new artwork to R2
        run: npm run images -- --upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
      - name: Commit changes
        run: |
          git config user.name "yugidle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data public/thumbs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: weekly card data refresh"
          git push
